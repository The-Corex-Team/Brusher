name: Build Brusher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      QT_VERSION: '6.8.3'
      QT_MODULES: 'qtimageformats'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Qt imageformats is required at runtime for PNG/JPEG/BMP open in
      # CanvasWidget::openImage and the MainWindow save dialogs. We
      # install it on every platform, not just macOS.

      - name: Install Qt (Linux/Windows)
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      # macOS-latest ships an SDK that no longer contains the legacy
      # AGL framework, but the default Qt archive on macos-latest can
      # pull it in via QtOpenGL, causing the link to fail with
      # "ld: framework 'AGL' not found". Pin host/target/arch/modules
      # explicitly so the install is reproducible and Qt 6's
      # OpenGLWidgets link list resolves against the modern OpenGL
      # framework only.
      - name: Install Qt (macOS, pinned)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Clean CMake Cache (Unix)
        if: runner.os != 'Windows'
        run: rm -rf build/ AppDir/usr

      - name: Clean CMake Cache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path AppDir\usr) { Remove-Item -Recurse -Force AppDir\usr }

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # ===================================================================
      #  Windows — windeployqt + NSIS installer via CPack
      # ===================================================================
      - name: Deploy Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windeployqt = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
          & $windeployqt `
              "${{ github.workspace }}\build\Release\brusher.exe" `
              --dir "${{ github.workspace }}\build\Release" `
              --release `
              --no-translations `
              --no-system-d3d-compiler `
              --no-opengl-sw `
              --imageformats `
              --compiler-runtime

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # CPack's NSIS generator needs makensis on PATH. windows-latest
          # doesn't ship it, so grab the portable 3.x release.
          $nsisVersion = '3.10'
          $nsisZip = "nsis-$nsisVersion.zip"
          $nsisUrl = "https://sourceforge.net/projects/nsis/files/NSIS%203/$nsisVersion/$nsisZip/download"
          $nsisRoot = 'C:\nsis'
          if (-not (Test-Path "$nsisRoot\makensis.exe")) {
              New-Item -ItemType Directory -Path $nsisRoot -Force | Out-Null
              Invoke-WebRequest -Uri $nsisUrl -OutFile "$env:RUNNER_TEMP\$nsisZip"
              Expand-Archive -Path "$env:RUNNER_TEMP\$nsisZip" -DestinationPath $nsisRoot -Force
          }
          echo "$nsisRoot" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # CPack's NSIS generator runs makensis against the
          # template generated from CPACK_NSIS_* variables.
          Push-Location build
          cpack -G NSIS -C Release
          Pop-Location
          Get-ChildItem build\*.exe | Format-Table Name, Length

      - name: Zip portable bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\Release\* -DestinationPath Brusher-windows-portable.zip -Force

      - name: Verify Qt imageformats deployed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $missing = @()
          foreach ($dll in @('Qt6Core.dll','Qt6Gui.dll','Qt6Widgets.dll','Qt6OpenGL.dll','Qt6OpenGLWidgets.dll','Qt6Svg.dll')) {
              if (-not (Test-Path "build\Release\$dll")) { $missing += $dll }
          }
          $imageDir = 'build\Release\imageformats'
          if (-not (Test-Path $imageDir)) {
              $missing += 'imageformats\*.dll (whole directory)'
          } else {
              $plug = Get-ChildItem $imageDir -Filter '*.dll' -ErrorAction SilentlyContinue
              Write-Host "imageformats plugins: $($plug.Name -join ', ')"
              foreach ($req in @('qjpeg.dll','qgif.dll')) {
                  if (-not (Test-Path "$imageDir\$req")) { $missing += "imageformats\$req" }
              }
          }
          if ($missing.Count -gt 0) {
              Write-Host "::error::Missing deployed files: $($missing -join ', ')"
              exit 1
          }

      # ===================================================================
      #  macOS — macdeployqt + .dmg
      # ===================================================================
      - name: Deploy Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # `add_executable(... MACOSX_BUNDLE ...)` in CMakeLists.txt
          # produces build/brusher.app; macdeployqt bundles Qt
          # frameworks and imageformats plugins in place.
          macdeployqt "${{ github.workspace }}/build/brusher.app" \
              -qmldir=. \
              -imageformats \
              -dmg
          ls -la build/

      - name: Verify Qt frameworks + imageformats deployed (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="build/brusher.app"
          for fw in QtCore QtGui QtWidgets QtOpenGL QtOpenGLWidgets QtSvg; do
              if [ ! -d "$APP/Contents/Frameworks/$fw.framework" ]; then
                  echo "::error::Missing framework: $fw"
                  exit 1
              fi
          done
          if [ ! -d "$APP/Contents/PlugIns/imageformats" ]; then
              echo "::error::Missing imageformats plugin directory"
              exit 1
          fi
          for plug in libqjpeg.dylib libqgif.dylib; do
              if [ ! -f "$APP/Contents/PlugIns/imageformats/$plug" ]; then
                  echo "::error::Missing imageformats plugin: $plug"
                  exit 1
              fi
          done
          ls "$APP/Contents/PlugIns/imageformats/"

      # ===================================================================
      #  Linux — linuxdeploy + AppImage + .deb
      # ===================================================================
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
              libfontconfig1 libfreetype6 libxcb-cursor0 libxcb-icccm4 \
              libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
              libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
              libxcb-xkb1 libxcb-render0 libxcb-shm0 libxcb-util1 \
              libxcb1 libxext6 libx11-6 libsm6 libice6 libxrender1 \
              libdbus-1-3 libglib2.0-0 zlib1g libegl1 libgles2 \
              file fuse libfuse2 desktop-file-utils libqt6svg6

      - name: Install linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          TOOLS="$HOME/AppImageTools"
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          # linuxdeploy-x86_64.AppImage
          if [ ! -x "$TOOLS/linuxdeploy-x86_64.AppImage" ]; then
              curl -L -o linuxdeploy-x86_64.AppImage \
                https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
              chmod +x linuxdeploy-x86_64.AppImage
          fi
          # linuxdeploy-plugin-qt-x86_64.AppImage
          if [ ! -x "$TOOLS/linuxdeploy-plugin-qt-x86_64.AppImage" ]; then
              curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage \
                https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
              chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          fi
          # Workaround for FUSE on runners where it isn't usable
          export LINUXDEPLOY_DISABLE_FUSE=1
          echo "LINUXDEPLOY_DISABLE_FUSE=$LINUXDEPLOY_DISABLE_FUSE" >> "$GITHUB_ENV"
          "$TOOLS/linuxdeploy-x86_64.AppImage" --version
          "$TOOLS/linuxdeploy-plugin-qt-x86_64.AppImage" --version

      - name: Install binary into AppDir (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rm -rf AppDir/usr
          DESTDIR="$PWD/AppDir" cmake --install build --config Release

      - name: Bundle Qt with linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          "$HOME/AppImageTools/linuxdeploy-x86_64.AppImage" \
              --appdir AppDir \
              --plugin qt \
              --desktop-file AppDir/brusher.desktop \
              --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/brusher.svg \
              --output appimage
          ls -la Brusher-*.AppImage

      - name: Build .deb via CPack (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The .deb depends on system Qt6 packages (resolved by CPack
          # SHLIBDEPS) — that is the standard way Qt apps are
          # distributed on Debian/Ubuntu. The AppImage produced above
          # is the self-contained artifact for users who don't want to
          # install system Qt.
          pushd build
          cpack -G DEB
          ls -la *.deb
          dpkg-deb -I *.deb | head -40
          popd

      - name: Tar portable bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The populated AppDir includes the .DirIcon, .desktop, AppRun
          # symlinks (preserved from the repo) and all bundled Qt libs.
          tar czf Brusher-Linux-portable.tar.gz AppDir/

      - name: Verify Qt imageformats deployed (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          missing=()
          for lib in libQt6Core.so.6 libQt6Gui.so.6 libQt6Widgets.so.6 \
                     libQt6OpenGL.so.6 libQt6OpenGLWidgets.so.6 \
                     libQt6Svg.so.6; do
              if ! find AppDir/usr/lib -name "$lib" -print -quit | grep -q .; then
                  missing+=("$lib")
              fi
          done
          if ! find AppDir/usr/lib/plugins/imageformats -name 'libqjpeg.so' -print -quit | grep -q .; then
              missing+=("imageformats/libqjpeg.so")
          fi
          if ! find AppDir/usr/lib/plugins/imageformats -name 'libqgif.so' -print -quit | grep -q .; then
              missing+=("imageformats/libqgif.so")
          fi
          if [ ${#missing[@]} -ne 0 ]; then
              echo "::error::Missing deployed files:"
              printf '  - %s\n' "${missing[@]}"
              exit 1
          fi
          echo "OK — all required Qt libs and imageformats plugins are present."

      # ===================================================================
      #  Artifacts
      # ===================================================================
      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-${{ matrix.os }}
          path: |
            build/*.exe
            Brusher-windows-portable.zip

      - name: Upload Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-${{ matrix.os }}
          path: |
            build/*.dmg
            build/brusher.app

      - name: Upload Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-${{ matrix.os }}
          path: |
            Brusher-*.AppImage
            build/*.deb
            Brusher-Linux-portable.tar.gz

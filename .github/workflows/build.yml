name: Build Brusher

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Qt (default)
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      # macOS-latest ships an SDK that no longer contains the legacy AGL
      # framework, but the default Qt archive on macos-latest can pull it
      # in via QtOpenGL, causing the link to fail with
      # "ld: framework 'AGL' not found". Pin host/target/arch/modules
      # explicitly so the install is reproducible and Qt 6's OpenGLWidgets
      # link list resolves against the modern OpenGL framework only.
      # qtimageformats is needed for the PNG/JPEG/BMP open paths used by
      # CanvasWidget::openImage and ProjectSerializer.
      - name: Install Qt (macOS, pinned)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats'
          cache: true

      - name: Clean CMake Cache (Unix)
        if: runner.os != 'Windows'
        run: rm -rf build/

      - name: Clean CMake Cache (Windows)
        if: runner.os == 'Windows'
        run: powershell -Command "if (Test-Path build) { Remove-Item -Recurse -Force build }"

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt (Windows)
        if: runner.os == 'Windows'
        run: |
          $qtPath = "${{ env.QT_ROOT_DIR }}"
          $windeployqt = "$qtPath\bin\windeployqt.exe"
          & $windeployqt "${{ github.workspace }}\build\Release\brusher.exe" --dir "${{ github.workspace }}\build\Release" --release --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime

      - name: Deploy Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          qtPath="${{ env.QT_ROOT_DIR }}"
          macdeployqt "${{ github.workspace }}/build/brusher.app" -dmg
          ls -la build/

      - name: Package (Ubuntu)
        if: runner.os == 'Linux'
        working-directory: build
        run: cpack -G DEB

      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-${{ matrix.os }}
          path: build/Release/

      - name: Upload Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-${{ matrix.os }}
          path: build/*.dmg

      - name: Upload Artifacts (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-${{ matrix.os }}
          path: |
            build/Brusher
            build/*.deb
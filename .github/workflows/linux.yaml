name: Build Brusher - Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest

    env:
      QT_VERSION: '6.8.3'
      QT_MODULES: 'qtimageformats'

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Qt
      # ---------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          set-env: true

      # ---------------------------------------------------------------------
      # Linux dependencies
      # ---------------------------------------------------------------------

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-render0 \
            libxcb-shm0 \
            libxcb-util1 \
            libxcb1 \
            libxext6 \
            libx11-6 \
            libsm6 \
            libice6 \
            libxrender1 \
            libdbus-1-3 \
            libglib2.0-0 \
            zlib1g \
            libegl1 \
            libgles2 \
            file \
            desktop-file-utils

      # ---------------------------------------------------------------------
      # Clean
      # ---------------------------------------------------------------------

      - name: Clean Build
        run: |
          rm -rf build
          rm -rf AppDir

      # ---------------------------------------------------------------------
      # Configure
      # ---------------------------------------------------------------------

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/AppDir/usr"

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------

      - name: Build
        run: |
          cmake --build build \
            --config Release \
            --parallel

      # ---------------------------------------------------------------------
      # Install and deploy Qt
      # ---------------------------------------------------------------------

      - name: Install Brusher
        run: |
          set -euo pipefail

          cmake --install build \
            --config Release

      # ---------------------------------------------------------------------
      # Verify package
      # ---------------------------------------------------------------------

      - name: Verify Linux Package
        run: |
          set -euo pipefail

          APPDIR="$GITHUB_WORKSPACE/AppDir"
          EXE="$APPDIR/usr/bin/brusher"

          if [ ! -f "$EXE" ]; then
            echo "ERROR: Brusher executable was not found."
            echo
            echo "AppDir contents:"
            find "$APPDIR" -maxdepth 5 -type f -print
            exit 1
          fi

          echo "Brusher package created successfully."
          echo "Executable: $EXE"

          echo
          echo "Deployment structure:"
          find "$APPDIR/usr" -maxdepth 4 -type f -print | sort

      # ---------------------------------------------------------------------
      # Create portable archive
      # ---------------------------------------------------------------------

      - name: Create Linux portable archive
        run: |
          set -euo pipefail

          tar -czf Brusher-Linux.tar.gz AppDir/

          ls -lh Brusher-Linux.tar.gz

      # ---------------------------------------------------------------------
      # Upload
      # ---------------------------------------------------------------------

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-Linux
          path: Brusher-Linux.tar.gz
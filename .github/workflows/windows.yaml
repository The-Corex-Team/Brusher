name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Windows
    runs-on: windows-2022

    env:
      QT_VERSION: '6.8.3'
      QT_MODULES: 'qtimageformats'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '17.0'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=dist

      - name: Build Brusher
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Stage Executable and Deploy Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Locate brusher.exe
          $exe = Get-ChildItem -Path build -Filter 'brusher.exe' -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            throw "brusher.exe was not found in the build directory."
          }

          # Create distribution directory
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'Brusher-Windows-x64'
          if (Test-Path $distDir) { Remove-Item -Recurse -Force $distDir }
          New-Item -ItemType Directory -Path $distDir | Out-Null

          # Copy main executable
          Copy-Item -Path $exe -Destination $distDir -Force
          $stagedExe = Join-Path $distDir 'brusher.exe'

          # Locate windeployqt
          $qtRoot = $env:Qt6_Dir
          if (-not $qtRoot) { $qtRoot = $env:QT_ROOT_DIR }
          $windeployqt = Join-Path $qtRoot 'bin\windeployqt.exe'

          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt.exe not found at $windeployqt"
          }

          # Run windeployqt with --compiler-runtime to bundle full MSVC CRT automatically
          & $windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            --verbose 1 `
            "$stagedExe"

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

      - name: Compress Release Package
        shell: pwsh
        run: |
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'Brusher-Windows-x64'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'Brusher-Windows-x64.zip'
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipPath -Force

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-Windows-x64
          path: Brusher-Windows-x64.zip

  smoke-test:
    name: Smoke-Test Package
    needs: build
    runs-on: windows-2022

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Brusher-Windows-x64
          path: test_dist

      - name: Enable WER Crash Dumps
        shell: cmd
        run: |
          if not exist "%LOCALAPPDATA%\CrashDumps" mkdir "%LOCALAPPDATA%\CrashDumps"
          reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\brusher.exe" /f /v DumpType /t REG_DWORD /d 2
          reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\brusher.exe" /f /v DumpFolder /t REG_EXPAND_SZ /d "%%LOCALAPPDATA%%\CrashDumps"

      - name: Execute Brusher Diagnostic Run
        shell: cmd
        run: |
          cd test_dist
          set QT_LOGGING_TO_CONSOLE=1
          set QT_DEBUG_PLUGINS=1
          start "" /b brusher.exe
          timeout /t 4 /nobreak >nul
          taskkill /im brusher.exe /f >nul 2>&1

      - name: Check for Crash Dumps
        if: always()
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:LOCALAPPDATA 'CrashDumps'
          if (Test-Path $dumpDir) {
            $dumps = Get-ChildItem $dumpDir -Filter '*.dmp'
            if ($dumps) {
              Write-Host "::error::Crash dump detected during smoke test!"
              foreach ($d in $dumps) {
                Copy-Item $d.FullName $env:GITHUB_WORKSPACE -Force
              }
            }
          }

      - name: Upload Crash Dump Artifact (if failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-Windows-Crash-Dump
          path: '*.dmp'
          if-no-files-found: ignore

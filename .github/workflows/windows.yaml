name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Install Qt
      # ---------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          set-env: true

      # ---------------------------------------------------------------------
      # Clean
      # ---------------------------------------------------------------------

      - name: Clean Build
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue

      # ---------------------------------------------------------------------
      # Verify Qt
      # ---------------------------------------------------------------------

      - name: Verify Qt
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"

          if (-not $env:QT_ROOT_DIR) {
            Write-Error "QT_ROOT_DIR is not set."
            exit 1
          }

          if (-not (Test-Path $env:QT_ROOT_DIR)) {
            Write-Error "Qt directory does not exist: $env:QT_ROOT_DIR"
            exit 1
          }

          $qtCore = Join-Path `
            $env:QT_ROOT_DIR `
            "lib\cmake\Qt6Core\Qt6CoreConfig.cmake"

          if (-not (Test-Path $qtCore)) {
            Write-Error "Qt6CoreConfig.cmake was not found:"
            Write-Error $qtCore
            exit 1
          }

          Write-Host "Qt 6.8.3 installation verified."

      # ---------------------------------------------------------------------
      # Configure
      # ---------------------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "package"

          cmake -S . -B build `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$prefix"

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      # ---------------------------------------------------------------------
      # Install application
      # ---------------------------------------------------------------------

      - name: Install Brusher
        shell: pwsh
        run: |
          cmake --install build `
            --config Release

      # ---------------------------------------------------------------------
      # Deploy Qt with windeployqt
      #
      # windeployqt is Qt's official Windows deployment tool.
      # It discovers the Qt DLLs and required plugins, including the
      # SVG icon engine when QtSvg is used.
      # ---------------------------------------------------------------------

      - name: Deploy Qt
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $exe = Join-Path $package "bin\brusher.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Brusher executable not found:"
            Write-Error $exe
            exit 1
          }

          & windeployqt `
            --release `
            --compiler-runtime `
            --no-translations `
            --dir "$package\bin" `
            "$exe"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "windeployqt failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

      # ---------------------------------------------------------------------
      # Verify SVG icon engine
      # ---------------------------------------------------------------------

      - name: Verify Qt Plugins
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"

          Write-Host "Checking deployed Qt plugins..."

          $qwindows = Join-Path $package "bin\platforms\qwindows.dll"
          $qsvgicon = Join-Path $package "bin\iconengines\qsvgicon.dll"

          if (-not (Test-Path $qwindows)) {
            Write-Error "Missing Qt Windows platform plugin:"
            Write-Error $qwindows
            exit 1
          }

          if (-not (Test-Path $qsvgicon)) {
            Write-Error "Missing Qt SVG icon engine:"
            Write-Error $qsvgicon
            exit 1
          }

          Write-Host "qwindows.dll found."
          Write-Host "qsvgicon.dll found."

      # ---------------------------------------------------------------------
      # Show package contents
      # ---------------------------------------------------------------------

      - name: Show Package
        shell: pwsh
        run: |
          Get-ChildItem `
            (Join-Path $env:GITHUB_WORKSPACE "package") `
            -Recurse

      # ---------------------------------------------------------------------
      # Verify executable
      # ---------------------------------------------------------------------

      - name: Verify Windows Package
        shell: pwsh
        run: |
          $exe = Join-Path `
            $env:GITHUB_WORKSPACE `
            "package\bin\brusher.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Brusher.exe was not found."
            exit 1
          }

          Write-Host "Brusher Windows package is ready."
          Write-Host "Executable: $exe"

      # ---------------------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------------------

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-windows-x64
          path: ${{ github.workspace }}/package/
name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    env:
      QT_VERSION: '6.8.3'
      QT_MODULES: 'qtimageformats'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: cmd
        run: choco install -y ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Clean Build
        shell: pwsh
        run: |
          if (Test-Path build)          { Remove-Item -Recurse -Force build }
          if (Test-Path windows_release) { Remove-Item -Recurse -Force windows_release }

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Locate brusher.exe
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # With -G Ninja + -DCMAKE_BUILD_TYPE=Release, the binary lands
          # directly in build/ (Ninja is single-config, so the build type
          # only affects flags, not the output directory).
          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE 'build\brusher.exe'),
            (Join-Path $env:GITHUB_WORKSPACE 'build\Release\brusher.exe')
          )

          $exe = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $exe = (Resolve-Path $c).Path; break }
          }
          if (-not $exe) {
            Write-Host '::error::brusher.exe not found under build/. Got:'
            Get-ChildItem -Recurse -Filter 'brusher.exe' $env:GITHUB_WORKSPACE | Select-Object FullName
            exit 1
          }

          $exeDir = Split-Path -Parent $exe
          Write-Host "brusher.exe located at: $exe"
          Write-Host "Deployment target dir: $exeDir"
          "exe=$exe"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exe_dir=$exeDir"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # windeployqt needs to find both the Qt bin dir and the Qt plugins
      # dir; on the jurplel install-qt-action image these are under
      # $Qt6_DIR / $QT_ROOT_DIR. The action exports $Qt6_Dir but not the
      # legacy $QT_ROOT_DIR, so we resolve the install path via the
      # windeployqt that ships with the SDK and explicitly pass the
      # --release flag so it deploys the matching Qt6Core/Qt6Gui/... DLLs
      # (without it, on a host that has both Release and Debug Qt in
      # PATH, it can pick the wrong arch and silently ship an
      # un-loadable qwindows.dll — which is exactly the "Available
      # platform plugins are: windows" failure users were hitting).
      - name: Deploy Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe     = "${{ steps.locate.outputs.exe }}"
          $exeDir  = "${{ steps.locate.outputs.exe_dir }}"

          # jurplel/install-qt-action exports Qt6_Dir (the Qt install
          # root, e.g. C:\Qt\6.8.3\msvc2022_64). The legacy $env:QT_ROOT_DIR
          # is also set on recent versions, but Qt6_Dir is the documented
          # one. Prefer Qt6_Dir, fall back to QT_ROOT_DIR.
          $qtRoot = $env:Qt6_Dir
          if (-not $qtRoot) { $qtRoot = $env:QT_ROOT_DIR }
          if (-not $qtRoot) {
            Write-Host '::error::Neither Qt6_Dir nor QT_ROOT_DIR is set. Cannot locate windeployqt.'
            exit 1
          }

          $windeployqt = Join-Path $qtRoot 'bin\windeployqt.exe'
          if (-not (Test-Path $windeployqt)) {
            Write-Host "::error::windeployqt.exe not found at $windeployqt"
            exit 1
          }

          Write-Host "Using windeployqt: $windeployqt"
          Write-Host "Deploying:         $exe"
          Write-Host "Into:              $exeDir"

          # NB: we deliberately do NOT pass --compiler-runtime. That flag
          # only stages vc_redist.x64.exe; the actual runtime DLLs
          # (vcruntime140.dll, msvcp140.dll, ...) still need to live next
          # to brusher.exe, which we copy explicitly in the next step.
          & $windeployqt `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            "$exe"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::windeployqt failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # windeployqt's --compiler-runtime (and even the implicit deploy on
      # this image) leaves the MSVC runtime DLLs behind. Users running
      # the artifact rarely run vc_redist.x64.exe, so copy the runtime
      # DLLs next to brusher.exe explicitly. VCINSTALLDIR is exported by
      # the ilammy/msvc-dev-cmd step and inherited here.
      - name: Copy MSVC runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exeDir = "${{ steps.locate.outputs.exe_dir }}"

          $vcRoot = $env:VCINSTALLDIR
          if (-not $vcRoot) {
            Write-Host '::error::VCINSTALLDIR is not set — MSVC dev cmd did not initialise.'
            exit 1
          }

          $redist = Join-Path $vcRoot 'Redist\MSVC'
          if (-not (Test-Path $redist)) {
            Write-Host "::error::VC redist directory not found at $redist"
            exit 1
          }

          $crtDir = $null
          $versions = Get-ChildItem -Path $redist -Directory | Sort-Object Name -Descending
          foreach ($v in $versions) {
            $candidate = Join-Path $v.FullName 'x64\Microsoft.VC143.CRT'
            if (Test-Path $candidate) {
              $crtDir = $candidate
              break
            }
          }

          if (-not $crtDir) {
            Write-Host "::error::Could not locate x64\Microsoft.VC143.CRT under $redist"
            exit 1
          }

          Write-Host "Copying MSVC runtime from $crtDir to $exeDir"

          $requiredRuntime = @(
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll',
            'msvcp140_1.dll',
            'msvcp140_2.dll',
            'concrt140.dll'
          )

          foreach ($dll in $requiredRuntime) {
            $src = Join-Path $crtDir $dll
            if (Test-Path $src) {
              Copy-Item -Path $src -Destination $exeDir -Force
            }
          }

      - name: Verify Qt deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exeDir = "${{ steps.locate.outputs.exe_dir }}"

          Write-Host "Verifying deployment in: $exeDir"

          # Core Qt runtime DLLs that must sit next to brusher.exe.
          $requiredDlls = @(
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6OpenGL.dll',
            'Qt6OpenGLWidgets.dll',
            'Qt6Svg.dll'
          )

          foreach ($dll in $requiredDlls) {
            $path = Join-Path $exeDir $dll
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing required Qt DLL: $dll"
              exit 1
            }
          }

          # The Windows platform plugin and its DLLs.
          $platformsDir = Join-Path $exeDir 'platforms'
          $requiredPlugins = @(
            'qwindows.dll'
          )

          if (-not (Test-Path $platformsDir)) {
            Write-Host '::error::Missing platforms\ directory'
            exit 1
          }

          foreach ($plug in $requiredPlugins) {
            $path = Join-Path $platformsDir $plug
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing platform plugin: $plug"
              exit 1
            }
          }

          # imageformats plugin (qtimageformats module).
          $imageFormatsDir = Join-Path $exeDir 'imageformats'
          if (-not (Test-Path $imageFormatsDir)) {
            Write-Host '::error::Missing imageformats\ directory'
            exit 1
          }

          $requiredImageFormats = @(
            'qjpeg.dll',
            'qgif.dll',
            'qsvg.dll'
          )

          foreach ($plug in $requiredImageFormats) {
            $path = Join-Path $imageFormatsDir $plug
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing imageformat plugin: $plug"
              exit 1
            }
          }

          # styles plugin (Fusion style lives here on Windows).
          $stylesDir = Join-Path $exeDir 'styles'
          if (Test-Path $stylesDir) {
            Write-Host "styles\ found:"
            Get-ChildItem $stylesDir | Select-Object Name
          } else {
            Write-Host "::warning::styles\ directory not deployed (Fusion style may fall back)"
          }

          # VC++ runtime (now copied explicitly from the MSVC redist).
          $requiredRuntime = @(
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll'
          )

          foreach ($dll in $requiredRuntime) {
            $path = Join-Path $exeDir $dll
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing MSVC runtime DLL: $dll"
              exit 1
            }
          }

          Write-Host 'Qt deployment verification passed.'

      - name: Collect build output into windows_release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The deployment target directory is wherever brusher.exe lives
          # (build/ with the Ninja single-config generator, or build/Release/
          # with a multi-config generator).
          $exeDir = "${{ steps.locate.outputs.exe_dir }}"

          # If windeployqt dropped files into build/ (single-config) and
          # the build also produced a build/Release/ tree (multi-config
          # leftover), include both so we don't lose anything. Otherwise
          # we'd duplicate the deploy, but Copy-Item with -Exclude keeps
          # the manifest out of the final archive.
          $src = $exeDir
          $dst = Join-Path $env:GITHUB_WORKSPACE 'windows_release'

          if (-not (Test-Path $src)) {
            throw "Build output not found at $src"
          }

          New-Item -ItemType Directory -Path $dst -Force | Out-Null

          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Recurse -Force `
            -Exclude 'CMakeFiles','*.cmake','CMakeCache.txt','build.ninja','rules.ninja'

          Write-Host "Contents of windows_release:"
          Get-ChildItem $dst -Recurse | Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-Windows
          path: windows_release

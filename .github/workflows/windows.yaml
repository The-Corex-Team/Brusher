name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    env:
      QT_VERSION: '6.8.3'
      QT_MODULES: 'qtimageformats'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Pin the whole build to MSVC 2022 x64. Without this, GitHub's
      # windows-latest image defaults to MSVC, but PATH/INCLUDE/LIB
      # are not exported into the step shell, so a later `cmake` and
      # `windeployqt` invocation can fail or pick the wrong compiler.
      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install Qt6 with the same MSVC 2022 x64 toolchain. Leaving the
      # host/tool unspecified used to let the action pick MinGW, which
      # then built against a Qt compiled for MSVC and produced a binary
      # that crashed silently at startup (GUI subsystem app, no console
      # to print the error).
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Clean Build
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }

      # Force the Visual Studio 17 2022 generator with the x64 platform.
      # Multi-config generators produce build/Release/, which is what the
      # deploy + packaging steps expect.
      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $windeployqt = Join-Path `
            $env:QT_ROOT_DIR `
            'bin\windeployqt.exe'

          & $windeployqt `
            "${{ github.workspace }}\build\Release\brusher.exe" `
            --dir "${{ github.workspace }}\build\Release" `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            --compiler-runtime

      - name: Verify imageformats
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $imageDir = 'build\Release\imageformats'

          if (-not (Test-Path $imageDir)) {
            throw "imageformats directory is missing"
          }

          foreach ($plugin in @(
            'qjpeg.dll',
            'qgif.dll'
          )) {
            if (-not (Test-Path "$imageDir\$plugin")) {
              throw "Missing image plugin: $plugin"
            }
          }

          Write-Host "Qt imageformats:"
          Get-ChildItem $imageDir -Filter '*.dll'

      # Smoke test: launch brusher.exe briefly. The app is a GUI subsystem
      # binary (WIN32_EXECUTABLE), so a startup crash returns immediately
      # with no output. Running it for ~2s and asserting it didn't exit
      # in <1s catches the silent-crash case without needing a display
      # server (we don't pump messages, but the process must stay alive
      # long enough to prove the runtime loaded).
      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = "${{ github.workspace }}\build\Release\brusher.exe"
          if (-not (Test-Path $exe)) {
            throw "brusher.exe not found at $exe"
          }

          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 2

          if ($p.HasExited) {
            throw "brusher.exe exited immediately (code $($p.ExitCode)). Startup crash likely — check toolchain / Qt deployment."
          }

          Write-Host "brusher.exe still running after 2s (PID $($p.Id)) — startup OK"
          Stop-Process -Id $p.Id -Force

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\Release\* `
            -DestinationPath Brusher-Windows.zip `
            -Force

          Get-Item Brusher-Windows.zip |
            Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-Windows
          path: Brusher-Windows.zip

name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    env:
      QT_VERSION: '6.8.3'
      QT_MODULES: 'qtimageformats'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MSVC 2022 Build Tools
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Locate vcvars64.bat
        id: vcvars
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          )

          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            throw "Could not find vcvars64.bat"
          }

          "vcvars=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Clean Build
        shell: pwsh
        run: |
          if (Test-Path build)     { Remove-Item -Recurse -Force build }
          if (Test-Path windows_release) { Remove-Item -Recurse -Force windows_release }

      - name: Configure CMake
        shell: cmd
        run: |
          call "${{ steps.vcvars.outputs.vcvars }}" >NUL
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          call "${{ steps.vcvars.outputs.vcvars }}" >NUL
          cmake --build build --config Release --parallel

      - name: Deploy Qt
        shell: cmd
        run: |
          call "${{ steps.vcvars.outputs.vcvars }}" >NUL
          "%QT_ROOT_DIR%\bin\windeployqt.exe" ^
            "%GITHUB_WORKSPACE%\build\Release\brusher.exe" ^
            --release ^
            --no-translations ^
            --no-system-d3d-compiler ^
            --no-opengl-sw ^
            --compiler-runtime

      - name: Collect build output into windows_release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:GITHUB_WORKSPACE 'build\Release'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'windows_release'

          if (-not (Test-Path $src)) {
            throw "Build output not found at $src"
          }

          New-Item -ItemType Directory -Path $dst -Force | Out-Null

          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Recurse -Force

          Write-Host "Contents of windows_release:"
          Get-ChildItem $dst -Recurse | Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-Windows
          path: windows_release

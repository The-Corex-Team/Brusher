name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Qt
      # ---------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          set-env: true

      # ---------------------------------------------------------------------
      # Clean
      # ---------------------------------------------------------------------

      - name: Clean Build
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue

      # ---------------------------------------------------------------------
      # Verify Qt
      # ---------------------------------------------------------------------

      - name: Verify Qt
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR = $env:QT_ROOT_DIR"
          Write-Host "QT_PLUGIN_PATH = $env:QT_PLUGIN_PATH"

          if (-not $env:QT_ROOT_DIR) {
            Write-Error "QT_ROOT_DIR is not set."
            exit 1
          }

          if (-not (Test-Path $env:QT_ROOT_DIR)) {
            Write-Error "Qt root directory does not exist: $env:QT_ROOT_DIR"
            exit 1
          }

          $qtCoreConfig = Join-Path `
            $env:QT_ROOT_DIR `
            "lib\cmake\Qt6Core\Qt6CoreConfig.cmake"

          if (-not (Test-Path $qtCoreConfig)) {
            Write-Host "Qt installation contents:"
            Get-ChildItem $env:QT_ROOT_DIR -Recurse | Select-Object -First 200

            Write-Error "Qt6CoreConfig.cmake was not found at $qtCoreConfig"
            exit 1
          }

          Write-Host "Qt6CoreConfig.cmake found:"
          Write-Host $qtCoreConfig

      # ---------------------------------------------------------------------
      # Configure
      # ---------------------------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "package"

          cmake -S . -B build `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_INSTALL_PREFIX="$prefix"

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      # ---------------------------------------------------------------------
      # Install and deploy
      # ---------------------------------------------------------------------

      - name: Install Brusher
        shell: pwsh
        run: |
          cmake --install build `
            --config Release

      # ---------------------------------------------------------------------
      # Verify package
      # ---------------------------------------------------------------------

      - name: Verify Windows Package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $exe = Join-Path $package "bin\brusher.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "Package contents:"
            Get-ChildItem $package -Recurse -ErrorAction SilentlyContinue

            Write-Error "Brusher.exe was not found at $exe"
            exit 1
          }

          Write-Host "Brusher package created successfully."
          Write-Host "Executable: $exe"

      # ---------------------------------------------------------------------
      # Upload
      # ---------------------------------------------------------------------

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-windows-x64
          path: ${{ github.workspace }}/package/
name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    env:
      QT_VERSION: '6.8.3'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Install Brusher
        run: |
          cmake --install build `
            --config Release `
            --prefix package

      - name: Verify Windows Package
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "package\bin\brusher.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "Package contents:"
            Get-ChildItem package -Recurse
            Write-Error "Brusher.exe was not found at $exe"
            exit 1
          }

          Write-Host "Found Brusher:"
          Write-Host $exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-windows-x64
          path: package/

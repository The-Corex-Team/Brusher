name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    env:
      QT_VERSION: '6.8.3'

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Qt
      # ---------------------------------------------------------------------

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      # ---------------------------------------------------------------------
      # Configure
      # ---------------------------------------------------------------------

      - name: Configure CMake
        run: |
          cmake -S . -B build

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------

      - name: Build
        run: |
          cmake --build build `
            --config Release `
            --parallel

      # ---------------------------------------------------------------------
      # Install and deploy
      # ---------------------------------------------------------------------

      - name: Install Brusher
        run: |
          cmake --install build `
            --config Release `
            --prefix "${{ github.workspace }}\package"

      # ---------------------------------------------------------------------
      # Verify package
      # ---------------------------------------------------------------------

      - name: Verify Windows Package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          $exe = Join-Path $package "bin\brusher.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "Package contents:"
            Get-ChildItem $package -Recurse -ErrorAction SilentlyContinue

            Write-Error "Brusher.exe was not found at $exe"
            exit 1
          }

          Write-Host "Brusher package created successfully."
          Write-Host "Executable: $exe"

      # ---------------------------------------------------------------------
      # Upload artifact
      # ---------------------------------------------------------------------

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-windows-x64
          path: ${{ github.workspace }}/package/
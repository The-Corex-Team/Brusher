name: Build Brusher - Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    env:
      QT_VERSION: '6.8.3'
      QT_MODULES: 'qtimageformats'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install -y ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Clean Build
        shell: pwsh
        run: |
          if (Test-Path build)          { Remove-Item -Recurse -Force build }
          if (Test-Path windows_release) { Remove-Item -Recurse -Force windows_release }

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt
        shell: cmd
        run: |
          "%QT_ROOT_DIR%\bin\windeployqt.exe" ^
            "%GITHUB_WORKSPACE%\build\brusher.exe" ^
            --release ^
            --no-translations ^
            --no-system-d3d-compiler ^
            --compiler-runtime

      # windeployqt's --compiler-runtime on the GitHub-hosted windows-latest
      # image (with MSVC set up via ilammy/msvc-dev-cmd) often drops only
      # vc_redist.x64.exe and leaves the actual msvcp140/vcruntime DLLs next
      # to brusher.exe. Since the users running the artifact won't run the
      # redist installer, copy the runtime DLLs from the MSVC redist folder
      # explicitly so brusher.exe can launch out of the box.
      - name: Copy MSVC runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path $env:GITHUB_WORKSPACE 'build'

          # The redist DLLs live under <VCINSTALLDIR>\Redist\MSVC\<ver>\x64\Microsoft.VC143.CRT\
          # ilammy/msvc-dev-cmd exposes VCToolsInstallDir / VCINSTALLDIR via
          # the dev cmd environment, which is inherited by pwsh here.
          $vcRoot = $env:VCINSTALLDIR
          if (-not $vcRoot) {
            Write-Host '::error::VCINSTALLDIR is not set — MSVC dev cmd did not initialise.'
            exit 1
          }

          $redist = Join-Path $vcRoot 'Redist\MSVC'
          if (-not (Test-Path $redist)) {
            Write-Host "::error::VC redist directory not found at $redist"
            exit 1
          }

          # Pick the newest MSVC redist version present.
          $versions = Get-ChildItem -Path $redist -Directory | Sort-Object Name -Descending
          $crtDir = $null
          foreach ($v in $versions) {
            $candidate = Join-Path $v.FullName 'x64\Microsoft.VC143.CRT'
            if (Test-Path $candidate) {
              $crtDir = $candidate
              break
            }
          }

          if (-not $crtDir) {
            Write-Host "::error::Could not locate x64\Microsoft.VC143.CRT under $redist"
            exit 1
          }

          Write-Host "Copying MSVC runtime from $crtDir"

          $requiredRuntime = @(
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll',
            'msvcp140_1.dll',
            'msvcp140_2.dll',
            'concrt140.dll'
          )

          foreach ($dll in $requiredRuntime) {
            $src = Join-Path $crtDir $dll
            if (Test-Path $src) {
              Copy-Item -Path $src -Destination $root -Force
            }
          }

      - name: Verify Qt deployment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = Join-Path $env:GITHUB_WORKSPACE 'build'

          # Core Qt runtime DLLs that must sit next to brusher.exe.
          $requiredDlls = @(
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6OpenGL.dll',
            'Qt6OpenGLWidgets.dll',
            'Qt6Svg.dll'
          )

          foreach ($dll in $requiredDlls) {
            $path = Join-Path $root $dll
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing required Qt DLL: $dll"
              exit 1
            }
          }

          # The Windows platform plugin and its DLLs.
          $platformsDir = Join-Path $root 'platforms'
          $requiredPlugins = @(
            'qwindows.dll'
          )

          if (-not (Test-Path $platformsDir)) {
            Write-Host '::error::Missing platforms\ directory'
            exit 1
          }

          foreach ($plug in $requiredPlugins) {
            $path = Join-Path $platformsDir $plug
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing platform plugin: $plug"
              exit 1
            }
          }

          # imageformats plugin (qtimageformats module).
          $imageFormatsDir = Join-Path $root 'imageformats'
          if (-not (Test-Path $imageFormatsDir)) {
            Write-Host '::error::Missing imageformats\ directory'
            exit 1
          }

          $requiredImageFormats = @(
            'qjpeg.dll',
            'qgif.dll',
            'qsvg.dll'
          )

          foreach ($plug in $requiredImageFormats) {
            $path = Join-Path $imageFormatsDir $plug
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing imageformat plugin: $plug"
              exit 1
            }
          }

          # styles plugin (Fusion style lives here on Windows).
          $stylesDir = Join-Path $root 'styles'
          if (Test-Path $stylesDir) {
            Write-Host "styles\ found:"
            Get-ChildItem $stylesDir | Select-Object Name
          } else {
            Write-Host "::warning::styles\ directory not deployed (Fusion style may fall back)"
          }

          # VC++ runtime (now copied explicitly from the MSVC redist).
          $requiredRuntime = @(
            'vcruntime140.dll',
            'vcruntime140_1.dll',
            'msvcp140.dll'
          )

          foreach ($dll in $requiredRuntime) {
            $path = Join-Path $root $dll
            if (-not (Test-Path $path)) {
              Write-Host "::error::Missing MSVC runtime DLL: $dll"
              exit 1
            }
          }

          Write-Host 'Qt deployment verification passed.'

      - name: Collect build output into windows_release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:GITHUB_WORKSPACE 'build'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'windows_release'

          if (-not (Test-Path $src)) {
            throw "Build output not found at $src"
          }

          New-Item -ItemType Directory -Path $dst -Force | Out-Null

          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Recurse -Force -Exclude 'CMakeFiles','*.cmake','CMakeCache.txt','build.ninja','rules.ninja'

          Write-Host "Contents of windows_release:"
          Get-ChildItem $dst -Recurse | Select-Object FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brusher-Windows
          path: windows_release
